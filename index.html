<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganteng Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .price { font-size: 24px; color: #2ecc71; font-weight: bold; margin: 10px 0; }
        button { background: #0070f3; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Produk" style="border-radius: 10px;">
        <h3>Kopi Ganteng Premium</h3>
        <p class="price">Rp 25.000</p>
        <button id="btn-bayar">Beli Sekarang</button>
    </div>

    <script>
        document.getElementById('btn-bayar').onclick = async () => {
            const btn = document.getElementById('btn-bayar');
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 25000, product_name: "Kopi Ganteng Premium" })
                });
                
                const result = await res.json();
                
                if (result.payment_url) {
                    window.location.href = result.payment_url;
                } else {
                    alert("Gagal ambil link pembayaran!");
                    btn.innerText = "Beli Sekarang";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Error koneksi!");
                btn.innerText = "Beli Sekarang";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
